name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-verify of any ref. (It was added so the scheduled sync could dispatch a verify
  # run for its own PR; that turned out not to count in the PR's merge box — the bot's PR does
  # trigger `pull_request`, GitHub just holds the run for approval, and sync.yml now approves
  # it. Kept because a hand-run verify is useful.)
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:offline
      - name: Offline bundle contains no Next, Studio, database, or Moments player
        run: node node_modules/tsx/dist/cli.mjs scripts/scan-offline-bundle.ts
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Web client contains no Studio or database markers
        run: npm run check:client
        working-directory: web
      - name: Tailwind boundaries hold in both directions
        run: npm run check:css
        working-directory: web
