name: Review tier

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tier-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tier:
    runs-on: ubuntu-latest
    steps:
      # This job has a write token. Keep the default checkout and treat PR content as data only.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compute and label the review tier
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tier.ts
