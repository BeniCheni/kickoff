name: Pages

# The app's public address (v0.2.2): https://benicheni.github.io/kickoff/. Every push to
# main — a release, or a sync PR that merged itself — rebuilds dist/ and deploys it as the
# GitHub Pages project site, so the demo is redeployed within minutes of the data landing.
# What it serves is a point-in-time build: the header's synced stamp and the staleness banner
# are the visitor's proof of how old the snapshot is, which is the whole point. No code
# change was needed — vite.config.ts already builds with `base: './'` and every view lives in
# query params, so the bundle resolves under the /kickoff/ path unchanged.
#
# Needs the repo's Settings → Pages → Source set to "GitHub Actions" (flipped 4 Sep 2026).
# Without it the `build` job fails at configure-pages ("Get Pages site failed … Not Found")
# and `deploy` is skipped — the first run on main showed exactly that — and nothing else is
# affected. workflow_dispatch redeploys by hand — it resolves the workflow path on main, so
# it works only once this file is there. Every action here is on its Node 24 major (v0.2.3):
# the Node 20 majors ran, but the runner forced them onto Node 24 and warned on every job.

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: read the tree · pages: publish the artifact · id-token: the OIDC token
# actions/deploy-pages uses to prove the artifact came from this workflow. Nothing writes to
# the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, never cancelled mid-flight. GitHub's own Pages starter workflow
# (actions/starter-workflows, pages/static.yml) sets exactly this, with the note "do NOT
# cancel in-progress runs as we want to allow these production deployments to complete" —
# a deploy stopped between upload and activation is the one state this workflow cannot
# reason about. Ordering still holds without cancelling: a push during a deploy waits as the
# single pending run, a further push replaces that pending run, and the newest tree is always
# the last one deployed. (v0.2.2 shipped `true`; changed in its review.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
