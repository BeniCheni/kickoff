document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: #e8e4d8; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #2c7a4b; }\n  a:hover { color: #1e5636; }\n  button { font-family: inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"padding:40px 44px 80px\">\n  <div style=\"max-width:760px;margin-bottom:34px\">\n    <div style=\"font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a9284\">Turn 1 · Table / Standings MVP<\u002Fdiv>\n    <h1 style=\"font-family:'Oswald';font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;color:#16211b;margin:6px 0 12px\">One screen inside Kickoff<\u002Fh1>\n    <p style=\"font-size:14px;line-height:1.65;color:#55614f;margin:0;text-wrap:pretty\">Built on Kickoff's own palette, type and provenance rules — same header, same competition colours from <code style=\"font-family:'IBM Plex Mono';font-size:12.5px\">competitions.ts<\u002Fcode>, same \"the data has a timestamp and a confidence\" posture. Live La Liga matchday 2 data, read off laliga.com. Three states: <a href=\"#1a\">1a<\u002Fa> mobile default, <a href=\"#1b\">1b<\u002Fa> dark with the zone legend and a row opened, <a href=\"#1c\">1c<\u002Fa> desktop.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:38px;align-items:flex-start\">\n\n    <!-- ============ 1a : MOBILE DEFAULT, LIGHT ============ -->\n    <div id=\"1a\" style=\"width:390px\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px\">\n        <span style=\"font-family:'Oswald';font-weight:700;font-size:12px;letter-spacing:.1em;background:#16211b;color:#f7f5ee;padding:4px 9px;border-radius:4px\">1a<\u002Fspan>\n        <span style=\"font-family:'Oswald';font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#55614f\">Default · 390px · light<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"width:390px;height:812px;overflow-y:auto;background:#f7f5ee;border:1px solid rgb(22 33 27 / .22);border-radius:16px;color:#16211b\">\n\n        <div style=\"padding:14px 14px 0\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n            <span style=\"font-family:'Oswald';font-weight:700;font-size:20px;letter-spacing:.07em;text-transform:uppercase\">Kickoff<\u002Fspan>\n            <span style=\"font-family:'Oswald';font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a9284\">Brooklyn · ET<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;margin-top:11px;border-bottom:1.5px solid rgb(22 33 27 / .12)\">\n            <span style=\"font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a9284;padding-bottom:8px\">Fixtures<\u002Fspan>\n            <span style=\"font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#16211b;padding-bottom:8px;box-shadow:inset 0 -2.5px 0 #2c7a4b\">Table<\u002Fspan>\n            <span style=\"font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a9284;padding-bottom:8px\">Results<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 2px\">\n          <span style=\"white-space:nowrap;font-size:11.5px;font-weight:600;color:#ffffff;background:#D85A30;border:1.5px solid transparent;border-radius:99px;padding:4px 10px\">🇪🇸 La Liga<\u002Fspan>\n          <span style=\"white-space:nowrap;font-size:11.5px;font-weight:600;color:#55614f;background:transparent;border:1.5px solid rgb(22 33 27 / .22);border-radius:99px;padding:4px 10px;opacity:.55\">🏴 PL<\u002Fspan>\n          <span st " hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"width:11px;height:11px;border-radius:2px;background:{{ z.color }}\"><\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:600\">{{ z.name }}<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono';font-size:10px;color:#8a9284\">{{ z.range }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;line-height:1.6;color:#8a9284;margin-top:10px;max-width:760px\">Sorting off points keeps the position column canonical and says so in a banner rather than letting a re-sorted row imply a league position it does not hold. Form reads oldest to newest and is lettered, so it survives greyscale and colour blindness. Kickoff times are sample data pending sync; the form sequence is illustrative.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNextFixture&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Table&quot;},&quot;zoneDividers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Table&quot;},&quot;formNewestFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Table&quot;}}\">\nclass Component extends DCLogic {\n  state = { openA: null, openB: 'BAR', legendA: false, legendB: true, split: 'overall', sort: 'pts' }\n\n  teams() {\n    return {\n      SEV: ['Sevilla FC', 'Sevilla'], BET: ['Real Betis', 'Betis'], ALA: ['Deportivo Alavés', 'Alavés'],\n      ATM: ['Atlético de Madrid', 'Atlético'], BAR: ['FC Barcelona', 'Barcelona'],\n      ESP: ['RCD Espanyol de Barcelona', 'Espanyol'], RMA: ['Real Madrid', 'Real Madrid'],\n      GET: ['Getafe CF', 'Getafe'], VIL: ['Villarreal CF', 'Villarreal'], DEP: ['RC Deportivo', 'Deportivo'],\n      OSA: ['CA Osasuna', 'Osasuna'], CEL: ['Celta', 'Celta'], RAC: ['R. Racing Club', 'Racing'],\n      RAY: ['Rayo Vallecano', 'Rayo'], VAL: ['Valencia CF', 'Valencia'], MGA: ['Málaga CF', 'Málaga'],\n      LEV: ['Levante UD', 'Levante'], ELC: ['Elche CF', 'Elche'], RSO: ['Real Sociedad', 'Real Sociedad'],\n      ATH: ['Athletic Club', 'Athletic'],\n    }\n  }\n\n  /* [code, movement, pl, w, d, l, gf, ga, pts, formString] — read off laliga.com, matchday 2. */\n  overall() {\n    return [\n      ['SEV', 1, 2, 2, 0, 0, 5, 2, 6, 'WW'], ['BET', 1, 2, 2, 0, 0, 2, 0, 6, 'WW'],\n      ['ALA', -1, 2, 1, 1, 0, 4, 1, 4, 'DW'], ['ATM', -1, 2, 1, 1, 0, 4, 2, 4, 'DW'],\n      ['BAR', 1, 1, 1, 0, 0, 5, 0, 3, 'W'], ['ESP', -1, 2, 1, 0, 1, 4, 2, 3, 'WL'],\n      ['RMA', 1, 1, 1, 0, 0, 2, 1, 3, 'W'], ['GET', 1, 2, 1, 0, 1, 1, 3, 3, 'WL'],\n      ['VIL', -1, 2, 0, 2, 0, 4, 4, 2, 'DD'], ['DEP', -1, 2, 0, 2, 0, 2, 2, 2, 'DD'],\n      ['OSA', 0, 1, 0, 1, 0, 0, 0, 1, 'D'], ['CEL', 0, 1, 0, 1, 0, 0, 0, 1, 'D'],\n      ['RAC', -1, 2, 0, 1, 1, 2, 3, 1, 'DL'], ['RAY', 1, 2, 0, 1, 1, 2, 3, 1, 'LD'],\n      ['VAL', 1, 2, 0, 1, 1, 0, 1, 1, 'LD'], ['MGA', 1, 2, 0, 1, 1, 1, 3, 1, 'DL'],\n      ['LEV', 1, 2, 0, 1, 1, 0, 3, 1, 'DL'], ['ELC', -1, 2, 0, 1, 1, 1, 6, 1, 'DL'],\n      ['RSO', -1, 1, 0, 0, 1, 0, 1, 0, 'L'], ['ATH', -1, 1, 0, 0, 1, 1, 3, 0, 'L'],\n    ]\n  }\n\n  home() {\n    return [\n      ['ATM', 0, 2, 1, 1, 0, 4, 2, 4, ''], ['ALA', 0, 1, 1, 0, 0, 3, 0, 3, ''],\n      ['ESP', 0, 2, 1, 0, 1, 4, 2, 3, ''], ['SEV', 0, 1, 1, 0, 0, 2, 1, 3, ''],\n      ['BET', 0, 1, 1, 0, 0, 1, 0, 3, ''], ['GET', 0, 1, 1, 0, 0, 1, 0, 3, ''],\n      ['RAC', 0, 1, 0, 1, 0, 2, 2, 1, ''], ['DEP', 0, 1, 0, 1, 0, 1, 1, 1, ''],\n      ['RAY', 0, 1, 0, 1, 0, 1, 1, 1, ''], ['MGA', 0, 1, 0, 1, 0, 1, 1, 1, ''],\n      ['OSA', 0, 1, 0, 1, 0, 0, 0, 1, ''], ['VAL', 0, 2, 0, 1, 1, 0, 1, 1, ''],\n      ['BAR', 0, 0, 0, 0, 0, 0, 0, 0, ''], ['RMA', 0, 0, 0, 0, 0, 0, 0, 0, ''],\n      ['LEV', 0, 0, 0, 0, 0, 0, 0, 0, ''], ['RSO', 0, 0, 0, 0, 0, 0, 0, 0, ''],\n      ['VIL', 0, 0, 0, 0, 0, 0, 0, 0, ''], ['CEL', 0, 0, 0, 0, 0, 0, 0, 0, ''],\n      ['ATH', 0, 1, 0, 0, 1, 1, 3, 0, ''], ['ELC', 0, 1, 0, 0, 1, 0, 5, 0, ''],\n    ]\n  }\n\n  away() {\n    return [\n      ['BAR', 0, 1, 1, 0, 0, 5, 0, 3, ''], ['SEV', 0, 1, 1, 0, 0, 3, 1, 3, ''],\n      ['RMA', 0, 1, 1, 0, 0, 2, 1, 3, ''], ['BET', 0, 1, 1, 0, 0, 1, 0, 3, ''],\n      ['VIL', 0, 2, 0, 2, 0, 4, 4, 2, ''], ['DEP', 0, 1, 0, 1, 0, 1, 1, 1, ''],\n      ['ALA', 0, 1, 0, 1, 0, 1, 1, 1, ''], ['ELC', 0, 1, 0, 1, 0, 1, 1, 1, ''],\n      ['CEL', 0, 1, 0, 1, 0, 0, 0, 1, ''], ['LEV', 0, 2, 0, 1, 1, 0, 3, 1, ''],\n      ['ATH', 0, 0, 0, 0, 0, 0, 0, 0, ''], ['ESP', 0, 0, 0, 0, 0, 0, 0, 0, ''],\n      ['ATM', 0, 0, 0, 0, 0, 0, 0, 0, ''], ['VAL', 0, 0, 0, 0, 0, 0, 0, 0, ''],\n      ['OSA', 0, 0, 0, 0, 0, 0, 0, 0, ''], ['RAY', 0, 1, 0, 0, 1, 1, 2, 0, ''],\n      ['RSO', 0, 1, 0, 0, 1, 0, 1, 0, ''], ['RAC', 0, 1, 0, 0, 1, 0, 1, 0, ''],\n      ['MGA', 0, 1, 0, 0, 1, 0, 2, 0, ''], ['GET', 0, 1, 0, 0, 1, 0, 3, 0, ''],\n    ]\n  }\n\n  /* Sample matchday-3 pairings, pending sync. [opponent, H/A, weekday, ET, stadium-local] */\n  next() {\n    return {\n      SEV: ['OSA', 'H', 'Sat', '3:00p', '21:00'], OSA: ['SEV', 'A', 'Sat', '3:00p', '21:00'],\n      BAR: ['ALA', 'H', 'Sat', '12:30p', '18:30'], ALA: ['BAR', 'A', 'Sat', '12:30p', '18:30'],\n      ATM: ['BET', 'H', 'Sun', '10:00a', '16:00'], BET: ['ATM', 'A', 'Sun', '10:00a', '16:00'],\n      RMA: ['ESP', 'H', 'Sun', '3:00p', '21:00'], ESP: ['RMA', 'A', 'Sun', '3:00p', '21:00'],\n      GET: ['VIL', 'H', 'Sat', '10:00a', '16:00'], VIL: ['GET', 'A', 'Sat', '10:00a', '16:00'],\n      DEP: ['CEL', 'H', 'Fri', '2:30p', '20:30'], CEL: ['DEP', 'A', 'Fri', '2:30p', '20:30'],\n      RAC: ['RAY', 'H', 'Sat', '8:00a', '14:00'], RAY: ['RAC', 'A', 'Sat', '8:00a', '14:00'],\n      VAL: ['MGA', 'H', 'Sun', '12:30p', '18:30'], MGA: ['VAL', 'A', 'Sun', '12:30p', '18:30'],\n      LEV: ['ELC', 'H', 'Mon', '3:00p', '21:00'], ELC: ['LEV', 'A', 'Mon', '3:00p', '21:00'],\n      RSO: ['ATH', 'H', 'Sun', '8:00a', '14:00'], ATH: ['RSO', 'A', 'Sun', '8:00a', '14:00'],\n    }\n  }\n\n  zones(dark) {\n    const rel = dark ? '#F7A864' : '#D85A30'\n    return [\n      { key: 'ucl', name: 'Champions League', short: 'Champions League', range: '1–5', color: '#8B6FE8', from: 1, to: 5, note: 'League phase. Spain holds a fifth berth on the 2025-26 association coefficient — it is not permanent.' },\n      { key: 'uel', name: 'Europa League', short: 'Europa League', range: '6', color: '#FF7A00', from: 6, to: 6, note: 'League phase. Can shift to 7th if the Copa del Rey winner already qualifies through the league.' },\n      { key: 'uecl', name: 'Conference League', short: 'Conference League', range: '7', color: '#2FB8C4', from: 7, to: 7, note: 'Play-off round, not the league phase directly.' },\n      { key: 'rel', name: 'Relegation', short: 'Relegation', range: '18–20', color: rel, from: 18, to: 20, note: 'Straight drop to LALIGA Hypermotion. No play-off in Spain.' },\n    ]\n  }\n\n  formPips(str, dark) {\n    const W = dark ? { bg: '#56c083', fg: '#0e1c15' } : { bg: '#2c7a4b', fg: '#ffffff' }\n    const D = dark ? { bg: '#6e8074', fg: '#e7efe9' } : { bg: '#8a9284', fg: '#ffffff' }\n    const L = dark ? { bg: '#f7a864', fg: '#0e1c15' } : { bg: '#d85a30', fg: '#ffffff' }\n    const E = dark ? { bg: '#1a3325', fg: '#3d5346' } : { bg: '#efead9', fg: '#c3bda9' }\n    const seq = (this.props.formNewestFirst ?? false) ? str.split('').reverse().join('') : str\n    const out = []\n    for (let i = 0; i < 5; i++) {\n      const c = seq[i]\n      if (c === 'W') out.push({ m: 'W', bg: W.bg, fg: W.fg })\n      else if (c === 'D') out.push({ m: 'D', bg: D.bg, fg: D.fg })\n      else if (c === 'L') out.push({ m: 'L', bg: L.bg, fg: L.fg })\n      else out.push({ m: '·', bg: E.bg, fg: E.fg })\n    }\n    return out\n  }\n\n  build(kind, dark, openKey, onToggleKey, sort) {\n    const src = kind === 'home' ? this.home() : kind === 'away' ? this.away() : this.overall()\n    const names = this.teams()\n    const nx = this.next()\n    const zs = this.zones(dark)\n    const isOverall = kind === 'overall'\n    const maxPl = Math.max.apply(null, this.overall().map((r) => r[2]))\n    const showZones = isOverall && (this.props.zoneDividers ?? true) && (!sort || sort === 'pts')\n\n    let list = src.map((r, i) => {\n      const [code, mv, pl, w, d, l, gf, ga, pts, form] = r\n      return { code, mv, pl, w, d, l, gf, ga, pts, form, pos: i + 1 }\n    })\n\n    if (sort && sort !== 'pts') {\n      const key = (o) => {\n        if (sort === 'gd') return o.gf - o.ga\n        if (sort === 'gf') return o.gf\n        if (sort === 'ga') return -o.ga\n        if (sort === 'ppg') return o.pl ? o.pts / o.pl : -1\n        if (sort === 'pl') return o.pl\n        return o.pts\n      }\n      list = list.slice().sort((a, b) => key(b) - key(a))\n    }\n\n    let lastZone = null\n    return list.map((o) => {\n      const gd = o.gf - o.ga\n      const zone = isOverall ? zs.find((z) => o.pos >= z.from && o.pos <= z.to) : null\n      const zoneStart = showZones && zone && zone.key !== lastZone ? zone.short : null\n      if (zone) lastZone = zone.key\n      else lastZone = null\n      const n = nx[o.code] || ['TBC', 'H', 'TBC', 'TBC', 'TBC']\n      const inHand = isOverall && o.pl < maxPl\n      const mvGlyph = o.mv > 0 ? '▲' : o.mv < 0 ? '▼' : '–'\n      const mvColor = o.mv > 0 ? (dark ? '#56c083' : '#2c7a4b') : o.mv < 0 ? (dark ? '#f7a864' : '#d85a30') : (dark ? '#6e8074' : '#8a9284')\n      return {\n        code: o.code,\n        pos: o.pos,\n        name: names[o.code][0],\n        short: names[o.code][1],\n        pl: o.pl, w: o.w, d: o.d, l: o.l, gf: o.gf, ga: o.ga, pts: o.pts,\n        gdText: gd > 0 ? '+' + gd : String(gd),\n        gdColor: gd > 0 ? (dark ? '#56c083' : '#2c7a4b') : gd < 0 ? (dark ? '#f7a864' : '#d85a30') : (dark ? '#a9b9ac' : '#55614f'),\n        mv: isOverall ? mvGlyph : '',\n        mvColor,\n        zoneColor: zone ? zone.color : 'transparent',\n        zoneStart,\n        zoneSentence: zone\n          ? zone.name + ' place (' + zone.range + '). ' + zone.note\n          : isOverall ? 'No qualification or relegation consequence at this position.' : 'Venue split — no zone applies.',\n        inHand,\n        form: this.formPips(o.form, dark),\n        wdl: o.w + '-' + o.d + '-' + o.l,\n        gfga: o.gf + '-' + o.ga,\n        ppg: o.pl ? (o.pts / o.pl).toFixed(2) : '—',\n        plText: inHand ? o.pl + ' of ' + maxPl : String(o.pl),\n        nextShort: n[2] + ' · ' + n[0] + ' (' + n[1] + ')',\n        nextLong: (n[1] === 'H' ? 'vs ' : 'away at ') + (names[n[0]] ? names[n[0]][0] : n[0]) + ' · ' + n[2],\n        nextEt: n[3],\n        nextLocal: n[4],\n        open: openKey === o.code,\n        aria: o.pos + '. ' + names[o.code][0] + ', ' + o.pts + ' points from ' + o.pl + ' played, goal difference ' + (gd > 0 ? '+' + gd : gd) + (zone ? ', ' + zone.name + ' place' : '') + (inHand ? ', one game in hand' : ''),\n        onToggle: () => this.setState((s) => ({ [onToggleKey]: s[onToggleKey] === o.code ? null : o.code })),\n      }\n    })\n  }\n\n  renderVals() {\n    const dark = true\n    const tabStyle = (on) =>\n      'flex:1;cursor:pointer;border:0;border-radius:5px;padding:6px 4px;font-family:\\'Oswald\\';font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;' +\n      (on ? 'background:#ffffff;color:#16211b;box-shadow:0 1px 2px rgb(22 33 27 / .12)' : 'background:transparent;color:#8a9284')\n\n    const splitTabs = [\n      { key: 'overall', label: 'Overall' },\n      { key: 'home', label: 'Home' },\n      { key: 'away', label: 'Away' },\n    ].map((t) => ({\n      label: t.label,\n      style: tabStyle(this.state.split === t.key),\n      onPick: () => this.setState({ split: t.key, openA: null }),\n    }))\n\n    const colStyle = (on, align) =>\n      'cursor:pointer;background:transparent;border:0;font-family:\\'Oswald\\';font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;text-align:' + align + ';padding:0;' +\n      (on ? 'color:#16211b;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:#2c7a4b' : 'color:#8a9284')\n\n    const sortCols = [\n      { key: 'pl', label: 'Pl' }, { key: null, label: 'W' }, { key: null, label: 'D' }, { key: null, label: 'L' },\n      { key: 'gf', label: 'GF' }, { key: 'ga', label: 'GA' }, { key: 'gd', label: 'GD' },\n      { key: 'pts', label: 'Pts' }, { key: 'ppg', label: 'PPG' },\n    ].map((c) => ({\n      label: c.label,\n      style: colStyle(c.key !== null && this.state.sort === c.key, 'center'),\n      onPick: c.key ? () => this.setState({ sort: c.key }) : () => {},\n    }))\n\n    const labels = { pts: 'points', gd: 'goal difference', gf: 'goals for', ga: 'goals against', ppg: 'points per game', pl: 'matches played' }\n    const sortNote =\n      this.state.sort === 'pts'\n        ? null\n        : 'Sorted by ' + labels[this.state.sort] + '. The Pos column still shows league position, and zone bands are hidden because they only describe the canonical order.'\n\n    return {\n      splitTabs,\n      splitIsVenue: this.state.split !== 'overall',\n      showForm: this.state.split === 'overall',\n      showNextChip: this.props.showNextFixture ?? true,\n      rowsA: this.build(this.state.split, false, this.state.openA, 'openA', 'pts'),\n      rowsB: this.build('overall', true, this.state.openB, 'openB', 'pts'),\n      rowsC: this.build('overall', false, null, 'openC', this.state.sort),\n      zoneList: this.zones(false),\n      zoneListDark: this.zones(true),\n      legendA: this.state.legendA,\n      legendB: this.state.legendB,\n      legendCaretA: this.state.legendA ? '▴' : '▾',\n      legendCaretB: this.state.legendB ? '▴' : '▾',\n      toggleLegendA: () => this.setState((s) => ({ legendA: !s.legendA })),\n      toggleLegendB: () => this.setState((s) => ({ legendB: !s.legendB })),\n      sortCols,\n      sortNote,\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
