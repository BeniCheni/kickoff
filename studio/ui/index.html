<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Kickoff Studio</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem('kickoff-theme')
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        var theme = stored === 'light' || stored === 'dark' ? stored : (dark ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
